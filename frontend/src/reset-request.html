<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Tracker — Reset Password</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="app">
      <div id="public-page-root" class="min-h-screen flex items-center justify-center bg-base-200">
        <div id="auth-card" class="card w-full max-w-md bg-base-100 shadow-xl">
          <div class="card-body">
            <h2 id="page-title" class="card-title justify-center mb-4">Reset Password</h2>
            <form id="reset-request-form">
              <div class="form-control mb-3">
                <label class="label" for="email-input">
                  <span class="label-text">Email address</span>
                </label>
                <input id="email-input" type="email" required placeholder="your@email.com" class="input input-bordered w-full" />
              </div>
              <div id="feedback-msg" role="alert" aria-live="polite" class="text-sm mb-3"></div>
              <button id="submit-btn" type="submit" class="btn btn-primary w-full">Send Reset Link</button>
            </form>
            <p class="text-center mt-4"><a href="/login.html" class="link link-primary">Back to Sign In</a></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="ts/reset-request.ts"></script>
  </body>
</html>
