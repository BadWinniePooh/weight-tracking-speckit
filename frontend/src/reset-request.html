<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Tracker — Reset Password</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Weight Tracker</h1>
      </header>
      <main>
        <section class="login-form">
          <h2>Reset Password</h2>
          <form id="reset-request-form">
            <div class="form-row">
              <label for="email-input">Email address</label>
              <input id="email-input" type="email" required placeholder="your@email.com" />
            </div>
            <div id="feedback-msg" role="alert" aria-live="polite"></div>
            <button id="submit-btn" type="submit">Send Reset Link</button>
          </form>
          <p><a href="/login.html">Back to Sign In</a></p>
        </section>
      </main>
    </div>
    <script type="module" src="ts/reset-request.ts"></script>
  </body>
</html>
