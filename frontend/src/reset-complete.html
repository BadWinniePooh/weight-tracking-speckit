<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Tracker — Set New Password</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="app">
      <div id="public-page-root" class="min-h-screen flex items-center justify-center bg-base-200 py-4">
        <div id="auth-card" class="card w-full max-w-md bg-base-100 shadow-xl">
          <div class="card-body">
            <h2 id="page-title" class="card-title justify-center mb-4">Set New Password</h2>
            <div id="token-error-msg" role="alert" class="alert alert-error mb-4 hidden">
              This reset link is invalid or has expired. <a href="/reset-request.html" class="link link-primary">Request a new reset link</a>.
            </div>
            <form id="reset-complete-form">
              <div class="form-control mb-3">
                <label class="label" for="new-password-input">
                  <span class="label-text">New password</span>
                </label>
                <input id="new-password-input" type="password" required class="input input-bordered w-full" />
              </div>
              <div class="form-control mb-3">
                <label class="label" for="confirm-password-input">
                  <span class="label-text">Confirm new password</span>
                </label>
                <input id="confirm-password-input" type="password" required class="input input-bordered w-full" />
              </div>
              <div id="feedback-msg" role="alert" aria-live="polite" class="text-sm mb-3"></div>
              <button id="submit-btn" type="submit" class="btn btn-primary w-full">Reset Password</button>
            </form>
            <div id="success-panel" class="hidden">
              <p class="text-center">Your password has been reset. Redirecting you to sign in…</p>
            </div>
            <p class="text-center mt-4"><a href="/login.html" class="link link-primary">Back to Sign In</a></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="ts/reset-complete.ts"></script>
  </body>
</html>
