<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Tracker — Login</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Weight Tracker</h1>
      </header>
      <main>
        <section class="login-form">
          <h2>Sign In</h2>
          <form id="login-form">
            <div class="form-row">
              <label for="username">Username</label>
              <input id="username" type="text" required placeholder="Your username" />
            </div>
            <div class="form-row">
              <label for="password">Password</label>
              <input id="password" type="password" required />
            </div>
            <div id="error-message" role="alert" aria-live="polite" class="error-msg"></div>
            <button type="submit">Sign In</button>
          </form>
          <p><a href="/reset-request.html" id="forgot-password-link">Forgot password?</a></p>
        </section>
      </main>
    </div>
    <script type="module" src="ts/login.ts"></script>
  </body>
</html>
