<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WeightTracker" />
    <title>Weight Tracker</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- Main app -->
    <div id="app">
      <nav id="main-navbar" class="navbar bg-base-100 shadow-sm">
        <div class="navbar-start">
          <a id="nav-brand" href="/index.html" class="btn btn-ghost text-xl">Weight Tracker</a>
        </div>
        <div class="navbar-center hidden lg:flex">
          <ul id="nav-links-desktop" class="menu menu-horizontal px-1">
            <li><a id="nav-dashboard" href="/index.html">Dashboard</a></li>
            <li><a id="nav-profile" href="/profile.html">Profile</a></li>
            <li><a id="nav-admin" href="/admin.html" hidden>Admin Dashboard</a></li>
          </ul>
        </div>
        <div class="navbar-end">
          <button id="logout-button" class="btn btn-ghost">Log out</button>
          <button id="nav-hamburger" class="btn btn-ghost lg:hidden" type="button" aria-label="Open navigation menu">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
        </div>
      </nav>
      <div id="nav-mobile-menu" class="lg:hidden" hidden>
        <ul id="nav-links-mobile" class="menu menu-vertical px-1 bg-base-100 shadow-sm">
          <li><a id="nav-mobile-dashboard" href="/index.html">Dashboard</a></li>
          <li><a id="nav-mobile-profile" href="/profile.html">Profile</a></li>
          <li><a id="nav-mobile-admin" href="/admin.html" hidden>Admin Dashboard</a></li>
          <li><button id="nav-mobile-logout" type="button" class="btn btn-ghost w-full text-left">Log out</button></li>
        </ul>
      </div>

      <main class="container mx-auto px-4 py-6">
        <!-- Chart section (FR-019: first child of <main>, hidden when no data) -->
        <section id="chart-section" hidden aria-labelledby="chart-heading">
          <div class="card bg-base-100 shadow mb-6">
            <div class="card-body">
              <h2 id="chart-heading" class="card-title">Weight Trend</h2>
              <div id="chart-container">
                <canvas id="chart-canvas"></canvas>
              </div>
              <div id="chart-info-msg" role="status" aria-live="polite"></div>
              <button id="chart-settings-btn" type="button" class="btn btn-ghost btn-sm" aria-label="Configure chart settings">
                Settings
              </button>
            </div>
          </div>
        </section>

        <!-- Settings modal (FR-020) -->
        <dialog id="chart-settings-modal" class="modal" aria-labelledby="settings-modal-title">
          <div class="modal-box">
            <h3 id="settings-modal-title" class="font-bold text-lg mb-4">Chart Settings</h3>
            <form id="chart-settings-form" method="dialog">
              <div class="form-control mb-3">
                <label class="label" for="weight-goal-input"><span class="label-text">Weight goal</span></label>
                <input id="weight-goal-input" type="number" step="any" aria-describedby="weight-goal-error" class="input input-bordered w-full" />
                <span id="weight-goal-error" role="alert" class="field-error text-error text-sm"></span>
              </div>

              <div class="form-control mb-3">
                <label class="label" for="loss-rate-input"><span class="label-text">Loss rate</span></label>
                <input id="loss-rate-input" type="number" step="any" aria-describedby="loss-rate-error" class="input input-bordered w-full" />
                <span id="loss-rate-error" role="alert" class="field-error text-error text-sm"></span>
              </div>

              <div class="form-control mb-3">
                <label class="label" for="carb-fat-ratio-input"><span class="label-text">Carb/fat ratio</span></label>
                <input id="carb-fat-ratio-input" type="number" step="any" aria-describedby="carb-fat-error" class="input input-bordered w-full" />
                <span id="carb-fat-error" role="alert" class="field-error text-error text-sm"></span>
              </div>

              <div class="form-control mb-3">
                <label class="label" for="buffer-value-input"><span class="label-text">Buffer value</span></label>
                <input id="buffer-value-input" type="number" step="any" aria-describedby="buffer-error" class="input input-bordered w-full" />
                <span id="buffer-error" role="alert" class="field-error text-error text-sm"></span>
              </div>

              <div class="modal-action">
                <button id="settings-save-btn" type="button" class="btn btn-primary">Save</button>
                <button id="settings-cancel-btn" type="button" class="btn btn-ghost">Cancel</button>
              </div>
            </form>
          </div>
        </dialog>

        <!-- Entry form -->
        <section class="entry-form" aria-labelledby="form-heading">
          <div class="card bg-base-100 shadow mb-6">
            <div class="card-body">
              <h2 id="form-heading" class="card-title">Log your weight</h2>

              <div class="form-control mb-3">
                <label class="label" for="unit-select"><span class="label-text">Unit</span></label>
                <select id="unit-select" aria-label="Weight unit" class="select select-bordered w-full">
                  <option value="kg">kg</option>
                  <option value="lbs">lbs</option>
                </select>
              </div>

              <div class="form-control mb-3">
                <label class="label" for="weight-input"><span class="label-text">Weight</span></label>
                <div class="flex gap-2">
                  <input
                    id="weight-input"
                    type="number"
                    step="0.1"
                    min="0"
                    placeholder="e.g. 75.5"
                    aria-label="Weight value"
                    aria-describedby="error-msg"
                    class="input input-bordered flex-1"
                  />
                  <button id="submit-btn" type="button" aria-label="Log weight entry" class="btn btn-primary">
                    Log Weight
                  </button>
                </div>
              </div>

              <div id="error-msg" role="alert" aria-live="polite" class="error-msg text-error text-sm"></div>
            </div>
          </div>
        </section>

        <!-- History list -->
        <section class="history" aria-labelledby="history-heading">
          <div class="card bg-base-100 shadow mb-6">
            <div class="card-body">
              <div class="collapse collapse-arrow">
                <input
                  type="checkbox"
                  id="history-toggle"
                  aria-labelledby="history-heading"
                />
                <div class="collapse-title p-0 min-h-0">
                  <h2 id="history-heading" class="card-title">History</h2>
                </div>
                <div class="collapse-content p-0">
                  <div class="overflow-x-auto">
                    <div id="entry-list" aria-label="Weight entry history"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Export section -->
        <section class="export-section" aria-labelledby="export-heading">
          <div class="card bg-base-100 shadow mb-6">
            <div class="card-body">
              <h2 id="export-heading" class="card-title">Export data</h2>
              <div class="form-row">
                <label for="export-format">Format</label>
                <select id="export-format" aria-label="Export format" class="select select-bordered">
                  <option value="csv">CSV</option>
                  <option value="json">JSON</option>
                </select>
              </div>
              <button id="export-btn" type="button" aria-label="Export weight entries" class="btn btn-primary">
                Export
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="ts/main.ts"></script>
  </body>
</html>
