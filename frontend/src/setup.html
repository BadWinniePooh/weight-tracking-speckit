<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Tracker — Setup</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Weight Tracker Setup</h1>
      </header>
      <main>
        <section class="setup-form">
          <h2>Create Admin Account</h2>
          <p>No users exist yet. Create an administrator account to get started.</p>
          <form id="setup-form">
            <div class="form-row">
              <label for="username">Username</label>
              <input id="username" type="text" required placeholder="admin" />
            </div>
            <div class="form-row">
              <label for="email">Email</label>
              <input id="email" type="email" required placeholder="admin@example.com" />
            </div>
            <div class="form-row">
              <label for="password">Password</label>
              <input id="password" type="password" required placeholder="At least 8 characters" />
            </div>
            <div class="form-row">
              <label for="confirm-password">Confirm Password</label>
              <input id="confirm-password" type="password" required />
            </div>
            <div id="error-message" role="alert" aria-live="polite" class="error-msg"></div>
            <button type="submit">Create Account</button>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="ts/setup.ts"></script>
  </body>
</html>
