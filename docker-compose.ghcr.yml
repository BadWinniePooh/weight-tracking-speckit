# Published-image overlay. Runs the stack from images published to GitHub Container
# Registry by the CI pipeline instead of building them from local source.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Pin a specific commit by exporting IMAGE_TAG with the full commit SHA, prefixed
# with "sha-" to match the tag the pipeline produces:
#   IMAGE_TAG=sha-<full-commit-sha> docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
#
# Defaults to `latest`, which tracks the newest trunk build.
#
# The base docker-compose.yml is unchanged and still builds from source, so plain
# `docker compose up --build` continues to work for local development.

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:-badwinniepooh}/weight-tracker-backend:${IMAGE_TAG:-latest}
    # Drop the build context so compose pulls the published image instead of
    # rebuilding it from source.
    build: !reset null

  frontend:
    image: ghcr.io/${GHCR_OWNER:-badwinniepooh}/weight-tracker-frontend:${IMAGE_TAG:-latest}
    build: !reset null
