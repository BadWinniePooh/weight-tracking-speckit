<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight Tracker</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <!-- Recovery screen — shown only when localStorage data is corrupt (FR-013) -->
    <div id="recovery-screen" hidden aria-live="assertive">
      <div class="recovery-content">
        <h1>Data Recovery</h1>
        <p id="recovery-msg">
          Your stored weight data appears to be corrupt and cannot be loaded.
          You can download the raw data for safekeeping, or reset the app to start fresh.
        </p>
        <button id="download-raw-btn" type="button">Download raw data</button>
        <button id="reset-btn" type="button" class="reset-btn">Reset app</button>
      </div>
    </div>

    <!-- Main app -->
    <div id="app">
      <header>
        <h1>Weight Tracker</h1>
      </header>

      <main>
        <!-- Chart section (FR-019: first child of <main>, hidden when no data) -->
        <section id="chart-section" hidden aria-labelledby="chart-heading">
          <h2 id="chart-heading">Weight Trend</h2>
          <div id="chart-container">
            <canvas id="chart-canvas"></canvas>
          </div>
          <div id="chart-info-msg" role="status" aria-live="polite"></div>
          <button id="chart-settings-btn" type="button" aria-label="Configure chart settings">
            Settings
          </button>
        </section>

        <!-- Settings modal (FR-020) -->
        <dialog id="chart-settings-modal" aria-labelledby="settings-modal-title">
          <h2 id="settings-modal-title">Chart Settings</h2>
          <form id="chart-settings-form" method="dialog">
            <div class="form-row">
              <label for="weight-goal-input">Weight goal</label>
              <input id="weight-goal-input" type="number" step="any" aria-describedby="weight-goal-error" />
              <span id="weight-goal-error" role="alert" class="field-error"></span>
            </div>

            <div class="form-row">
              <label for="loss-rate-input">Loss rate</label>
              <input id="loss-rate-input" type="number" step="any" aria-describedby="loss-rate-error" />
              <span id="loss-rate-error" role="alert" class="field-error"></span>
            </div>

            <div class="form-row">
              <label for="carb-fat-ratio-input">Carb/fat ratio</label>
              <input id="carb-fat-ratio-input" type="number" step="any" aria-describedby="carb-fat-error" />
              <span id="carb-fat-error" role="alert" class="field-error"></span>
            </div>

            <div class="form-row">
              <label for="buffer-value-input">Buffer value</label>
              <input id="buffer-value-input" type="number" step="any" aria-describedby="buffer-error" />
              <span id="buffer-error" role="alert" class="field-error"></span>
            </div>

            <div class="modal-actions">
              <button id="settings-save-btn" type="button">Save</button>
              <button id="settings-cancel-btn" type="button">Cancel</button>
            </div>
          </form>
        </dialog>

        <!-- Entry form -->
        <section class="entry-form" aria-labelledby="form-heading">
          <h2 id="form-heading">Log your weight</h2>

          <div class="form-row">
            <label for="unit-select">Unit</label>
            <select id="unit-select" aria-label="Weight unit">
              <option value="kg">kg</option>
              <option value="lbs">lbs</option>
            </select>
          </div>

          <div class="form-row">
            <label for="weight-input">Weight</label>
            <input
              id="weight-input"
              type="number"
              step="0.1"
              min="0"
              placeholder="e.g. 75.5"
              aria-label="Weight value"
              aria-describedby="error-msg"
            />
          </div>

          <div id="error-msg" role="alert" aria-live="polite" class="error-msg"></div>

          <button id="submit-btn" type="button" aria-label="Log weight entry">
            Log Weight
          </button>
        </section>

        <!-- History list -->
        <section class="history" aria-labelledby="history-heading">
          <h2 id="history-heading">History</h2>
          <div id="entry-list" aria-label="Weight entry history"></div>
        </section>

        <!-- Export section -->
        <section class="export-section" aria-labelledby="export-heading">
          <h2 id="export-heading">Export data</h2>
          <div class="form-row">
            <label for="export-format">Format</label>
            <select id="export-format" aria-label="Export format">
              <option value="csv">CSV</option>
              <option value="json">JSON</option>
            </select>
          </div>
          <button id="export-btn" type="button" aria-label="Export weight entries">
            Export
          </button>
        </section>
      </main>
    </div>

    <script type="module" src="ts/main.ts"></script>
  </body>
</html>
