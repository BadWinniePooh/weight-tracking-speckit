version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: weighttracker
      POSTGRES_USER: weighttracker
      POSTGRES_PASSWORD: weighttracker
    volumes:
      - weighttracker-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weighttracker -d weighttracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: WeightTracker.Api/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=weighttracker;Username=weighttracker;Password=weighttracker"
      AllowedOrigin: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_URL: "http://localhost:8080"
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  weighttracker-data:
